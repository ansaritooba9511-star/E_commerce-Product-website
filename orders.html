<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina | Order Tracking & Customer History</title>
  <meta name="description" content="Track your Lumina orders directly using your phone number without needing to log in. View real-time order history and delivery details.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo" id="brandLogo">
        <div class="brand-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <span>LUMINA</span>
      </a>

      <!-- Page Navigation Links -->
      <nav>
        <ul class="nav-links">
          <li>
            <a href="index.html" class="nav-link" id="navProducts">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
              </svg>
              <span>Products</span>
            </a>
          </li>
          <li>
            <a href="orders.html" class="nav-link active" id="navOrders">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
              </svg>
              <span>My Orders</span>
              <span class="nav-badge" id="totalOrdersBadge">...</span>
            </a>
          </li>
          <li>
            <a href="admin.html" class="nav-link" id="navAdmin">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <span>Admin Panel</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="btn btn-primary btn-sm">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span>Shop More</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Orders Content -->
  <main class="container">
    <section class="orders-hero">
      <div class="hero-pill">
        <span class="pulse-dot"></span>
        <span>Real-Time Database Sync</span>
      </div>
      <h1 class="hero-title">Customer Order Lookup</h1>
      <p class="hero-subtitle">
        Enter your phone number below to quickly track your order status and shipping details. No login or password required.
      </p>

      <!-- Search by Customer Phone Number -->
      <div class="order-search-panel">
        <label for="searchPhoneInput" style="display: block; text-align: left; margin-bottom: 0.6rem; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary);">
          Track using your Phone Number:
        </label>
        <div class="order-search-form">
          <div class="search-box" style="margin: 0; min-width: 0;">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
            <input 
              type="text" 
              id="searchPhoneInput" 
              class="search-input" 
              placeholder="e.g. 9876543210..." 
              autocomplete="off"
            />
          </div>
          <button class="btn btn-primary" id="btnSearchOrders">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <span>Track</span>
          </button>
          <button class="btn btn-secondary" id="btnClearSearch" title="Show all orders">
            Reset
          </button>
        </div>
      </div>

      <!-- Quick Metrics -->
      <div style="display: flex; gap: 2rem; justify-content: center; margin-bottom: 2.5rem; flex-wrap: wrap;">
        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); padding: 0.75rem 1.5rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.75rem;">
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Orders Placed:</span>
          <strong id="statTotalOrders" style="font-size: 1.25rem; color: #a5b4fc; font-family: var(--font-display);">...</strong>
        </div>
        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); padding: 0.75rem 1.5rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.75rem;">
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Customer Discounts Given:</span>
          <strong id="statTotalSavings" style="font-size: 1.25rem; color: #34d399; font-family: var(--font-display);">...</strong>
        </div>
      </div>
    </section>

    <!-- Orders Cards List -->
    <section class="order-cards-list" id="ordersList" aria-label="Customer Orders List">
      <!-- Injected via JavaScript -->
    </section>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Configuration & Database Utilities -->
  <script src="js/supabase-config.js?v=2.0"></script>
  <!-- Orders Page Logic -->
  <script src="js/orders.js?v=2.0"></script>
</body>
</html>
